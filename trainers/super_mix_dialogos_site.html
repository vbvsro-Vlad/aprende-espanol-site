<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тренажер: Живые Диалоги PRO</title>
    <style>
        
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f7f8fa;
            margin: 0;
            min-height: 100vh;
            color: #243044;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 50px 20px;
        }

        .container {
            background: #ffffff;
            width: 100%;
            max-width: 680px;
            padding: 42px;
            border-radius: 24px;
            box-shadow: 0 12px 35px rgba(31, 41, 55, 0.10);
            border: 1px solid #e8ebf0;
            text-align: center;
        }

        h2 {
            color: #243044;
            margin: 0 0 12px;
            font-size: 1.8rem;
            line-height: 1.25;
        }

        .badge {
            display: inline-block;
            background: #f2b705;
            color: #ffffff;
            padding: 5px 11px;
            border-radius: 999px;
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            vertical-align: middle;
        }

        .score-board {
            color: #687386;
            font-size: 1rem;
            margin: 0 0 24px;
        }

        #current-score {
            color: #d62828;
            font-weight: 700;
        }

        .timer-bar {
            width: 100%;
            height: 7px;
            background: #e9edf2;
            border-radius: 999px;
            margin-bottom: 26px;
            overflow: hidden;
        }

        .timer-progress {
            width: 100%;
            height: 100%;
            background: #d62828;
            transition: width 1s linear;
        }

        .phrase-display {
            background: #fff8e6;
            border-left: 5px solid #f2b705;
            padding: 24px 22px;
            border-radius: 14px;
            font-size: 1.35rem;
            font-weight: 600;
            color: #243044;
            margin-bottom: 22px;
            min-height: 72px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        input[type="text"] {
            width: 100%;
            padding: 16px 18px;
            border: 2px solid #e1e5eb;
            background: #ffffff;
            color: #243044;
            border-radius: 12px;
            font-size: 1.05rem;
            margin-bottom: 14px;
            outline: none;
            transition: border-color .2s, box-shadow .2s;
        }

        input[type="text"]:focus {
            border-color: #d62828;
            box-shadow: 0 0 0 4px rgba(214, 40, 40, 0.08);
        }

        button {
            background: #d62828;
            color: #ffffff;
            border: none;
            padding: 16px 20px;
            font-size: 1.05rem;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            font-weight: 700;
            transition: transform .2s, background .2s;
        }

        button:hover {
            background: #b71f1f;
            transform: translateY(-1px);
        }

        .feedback {
            margin-top: 20px;
            font-weight: 600;
            font-size: 1rem;
            min-height: 30px;
            line-height: 1.5;
        }

        .correct {
            color: #16834b;
        }

        .incorrect {
            color: #d62828;
        }

        @media (max-width: 600px) {
            body {
                padding: 20px 14px;
            }

            .container {
                padding: 28px 20px;
                border-radius: 18px;
            }

            h2 {
                font-size: 1.45rem;
            }

            .phrase-display {
                font-size: 1.15rem;
                padding: 20px 16px;
            }
        }

    </style>
</head>
<body>

<div class="container">
    <h2>Тренажер: Живые Диалоги 🇪🇸 <span class="badge">PRO</span></h2>
    <div class="score-board">Серия правильных реплик: <span id="current-score">0</span> из 20</div>
    
    <div class="timer-bar"><div class="timer-progress" id="progress"></div></div>
    <div class="phrase-display" id="russian-text">Нажмите «СТАРТ ДИАЛОГА»</div>
    
    <input type="text" id="answer-input" placeholder="Введите реплику на испанском..." autocomplete="off" disabled>
    <button id="main-btn" onclick="initTrainer()">СТАРТ ДИАЛОГА</button>
    
    <div class="feedback" id="feedback-zone"></div>
</div>

<script>
    const database = [
        // --- Блок 1: Сцена «Кафе (Заказ и споры)» ---
        { ru: "Я хочу съесть пиццу.", es: "Quiero comer pizza" },
        { ru: "Я хочу съесть пиццу и выпить стакан яблочного сока.", es: "Quiero comer pizza y beber un vaso de jugo de manzana" },
        { ru: "Ты можешь принести пиццу сейчас?", es: "Puedes traer la pizza ahora" },
        { ru: "Я спешу и я хочу есть.", es: "Tengo prisa y hambre" },
        { ru: "Она хочет есть, но она не хочет есть.", es: "Quiere comer pero no quiere comer" },
        { ru: "Нет, спасибо. Ты можешь принести счет, пожалуйста?", es: "No gracias puedes traer la cuenta por favor" },
        { ru: "Я хочу заплатить.", es: "Quiero pagar" },
        { ru: "Да, у меня есть евро и я могу заплатить без карты.", es: "Si tengo los euros y puedo pagar sin tarjeta" },
        { ru: "Пожалуйста, ты можешь мне дать стакан яблочного сока?", es: "Por favor me puedes dar un vaso de jugo de manzana" },
        { ru: "Круассан с собой, пожалуйста.", es: "Un cruasan para llevar por favor" },
        { ru: "Но разве евро — это не наличные?", es: "Pero los euros no son efectivo" },
        { ru: "В Испании используют евро.", es: "En Espana usan euros" },

        // --- Блок 2: Сцена «Отель (Заселение)» ---
        { ru: "Да, у меня есть бронь.", es: "Si tengo una reserva" },
        { ru: "Я хочу мой ключ, пожалуйста.", es: "Quiero mi llave por favor" },
        { ru: "Я очень устал.", es: "Estoy muy cansado" },
        { ru: "Она очень устала.", es: "Esta muy cansada" },
        { ru: "Где находится отель?", es: "Donde esta el hotel" },
        { ru: "Где находится завтрак?", es: "Donde esta el desayuno" },
        { ru: "Завтрак не готов.", es: "El desayuno no esta listo" },
        { ru: "Кондиционер не работает.", es: "El aire acondicionado no funciona" },
        { ru: "Ты можешь проверить кондиционер сейчас?", es: "Puedes verificar el aire acondicionado ahora" },
        { ru: "У меня нет ключа.", es: "No tengo la llave" },

        // --- Блок 3: Фиксация речевого автомата (Микс из чата) ---
        { ru: "Думаю, что практиковать диалоги с тобой проще.", es: "Creo que es mas facil practicar los dialogos contigo" },
        { ru: "Я не хочу сказать просто, я хочу сказать проще.", es: "No quiero decir simple quiero decir mas simple" },
        { ru: "Ты можешь создать тренажер?", es: "Puedes crear un simulador" },
        { ru: "Придумай тренажер.", es: "Inventa un simulador" },
        { ru: "Давай попробуем диалог.", es: "Vamos a probar el dialogo" },
        { ru: "Я живу в Мадриде.", es: "Vivo en Madrid" },
        { ru: "Ты ешь пиццу сейчас.", es: "Comes pizza ahora" },
        { ru: "Он каждый день учит испанский.", es: "Estudia espanol todos los dias" },
        { ru: "Я не учусь сейчас.", es: "No estudio ahora" },
        { ru: "Ты живешь в Мадриде?", es: "Vives en Madrid" },
        { ru: "Он не работает дома.", es: "No работает в доме" }, // Альтернатива: No trabaja en casa
        { ru: "Она умная.", es: "Es inteligente" },
        { ru: "Ты менеджер и ты работаешь дома.", es: "Eres manager y trabajas en casa" }
    ];

    let activePhrase = null;
    let currentStreak = 0;
    let stageChecking = false;
    let timerId = null;
    let timeLeft = 30;

    const ruDisplay = document.getElementById('russian-text');
    const inputField = document.getElementById('answer-input');
    const actionBtn = document.getElementById('main-btn');
    const feedbackField = document.getElementById('feedback-zone');
    const streakDisplay = document.getElementById('current-score');
    const progressBar = document.getElementById('progress');

    function cleanString(str) {
        return str.toLowerCase()
            .replace(/[.,\/#!$%\^&\*;:{}=\-_`~()¿?]/g, "")
            .replace(/[áäà]/g, "a").replace(/[éëè]/g, "e")
            .replace(/[íïì]/g, "i").replace(/[óöò]/g, "o")
            .replace(/[úüù]/g, "u").replace(/ñ/g, "n")
            .trim();
    }

    function initTrainer() {
        currentStreak = 0;
        streakDisplay.innerText = currentStreak;
        inputField.disabled = false;
        triggerNext();
    }

    function startTimer() {
        clearInterval(timerId);
        timeLeft = 30;
        progressBar.style.width = "100%";
        
        timerId = setInterval(() => {
            timeLeft--;
            progressBar.style.width = (timeLeft / 30 * 100) + "%";
            
            if (timeLeft <= 0) {
                clearInterval(timerId);
                timeOutFail();
            }
        }, 1000);
    }

    function timeOutFail() {
        feedbackField.innerHTML = `<span class='incorrect'>⏱️ Время вышло! Надо было: <b>${activePhrase.es}</b></span>`;
        currentStreak = 0;
        streakDisplay.innerText = currentStreak;
        actionBtn.innerText = "Следующая реплика";
        actionBtn.onclick = triggerNext;
        stageChecking = false;
    }

    function triggerNext() {
        clearInterval(timerId);
        if (currentStreak >= 20) {
            ruDisplay.innerText = "🏆 ПОТРЯСАЮЩЕ! Вы подчинили себе все диалоги! Настоящий PRO!";
            inputField.disabled = true;
            inputField.value = "";
            progressBar.style.width = "0%";
            actionBtn.innerText = "Начать заново";
            actionBtn.onclick = initTrainer;
            return;
        }

        activePhrase = database[Math.floor(Math.random() * database.length)];
        ruDisplay.innerText = activePhrase.ru;
        inputField.value = "";
        feedbackField.innerText = "";
        inputField.focus();

        actionBtn.innerText = "Проверить реплику";
        actionBtn.onclick = evaluateAnswer;
        stageChecking = true;
        startTimer();
    }

    function evaluateAnswer() {
        clearInterval(timerId);
        const userClean = cleanString(inputField.value);
        const correctClean = cleanString(activePhrase.es);

        // Интеллектуальное сравнение строк
        if (userClean === correctClean || correctClean.includes(userClean) && userClean.length > 5) {
            feedbackField.innerHTML = "<span class='correct'>🎯 Отличный ответ! Собеседник доволен.</span>";
            currentStreak++;
            streakDisplay.innerText = currentStreak;
        } else {
            feedbackField.innerHTML = `<span class='incorrect'>Не понял... Правильно: <b>${activePhrase.es}</b></span>`;
            currentStreak = 0; 
            streakDisplay.innerText = currentStreak;
        }

        actionBtn.innerText = "Следующая реплика";
        actionBtn.onclick = triggerNext;
        stageChecking = false;
    }

    inputField.addEventListener("keyup", function(e) {
        if (e.key === "Enter") {
            if (stageChecking) evaluateAnswer();
            else triggerNext();
        }
    });
</script>

</body>
</html>
