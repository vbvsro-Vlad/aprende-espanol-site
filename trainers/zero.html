<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aprende Español: Абсолютный Ноль 🥇</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0f19;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: #fff;
            padding: 20px;
        }
        .container {
            background: #151d30;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(52, 152, 219, 0.15);
            width: 100%;
            max-width: 540px;
            text-align: center;
            border: 1px solid #2d3d5a;
        }
        h2 { color: #3498db; margin-top: 0; font-size: 1.4rem; text-transform: uppercase; letter-spacing: 1px; }
        
        /* Карточка-инструкция */
        .hacker-card {
            background: linear-gradient(135deg, rgba(52, 152, 219, 0.08) 0%, rgba(46, 204, 113, 0.03) 100%);
            border: 1px solid rgba(52, 152, 219, 0.2);
            border-left: 5px solid #3498db;
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: left;
        }
        .hacker-title {
            font-weight: bold;
            color: #3498db;
            font-size: 0.85rem;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .role-tag {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        .role-pablo { background: rgba(52, 152, 219, 0.2); color: #3498db; }
        .role-lucia { background: rgba(230, 126, 34, 0.2); color: #e67e22; }

        .dictation-zone {
            background: #1f2d4d;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #233554;
            text-align: left;
        }
        .step-info {
            font-size: 0.8rem;
            text-transform: uppercase;
            color: #84817a;
            font-weight: bold;
            margin-bottom: 10px;
            text-align: center;
        }
        
        input[type="text"] {
            width: 100%;
            padding: 14px;
            border: 2px solid #3b5998;
            background-color: #0b0f19;
            color: white;
            border-radius: 8px;
            font-size: 1.1rem;
            box-sizing: border-box;
            margin-bottom: 15px;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus { border-color: #3498db; outline: none; }
        
        /* Стили умного интерактивного разбора ошибок */
       .error-word {
           color: #ee5253;
           text-decoration: line-through;
           font-weight: bold;
       }

        .correct-fix {
            color: #10ac84;
            font-weight: bold;
            font-size: 0.95rem;
            margin-left: 4px;
            margin-right: 8px;
        }
        .missing-word {
            color: #ff9f43;
            font-style: italic;
        }
        
        .action-btn {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 14px;
            font-size: 1.1rem;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            transition: background 0.2s;
        }
        .action-btn:hover { background-color: #2980b9; }
        .control-btn {
            background: #233554;
            color: #fff;
            border: none;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
            width: 100%;
            margin-bottom: 15px;
        }
        .control-btn:disabled { background: #16222f; color: #4b6584; cursor: not-allowed; }
        .feedback { margin-top: 15px; font-size: 1rem; line-height: 1.5; min-height: 25px; text-align: left; }
        
        .explanation-card {
            background: #16222f;
            border-left: 4px solid #ff9f43;
            padding: 12px;
            margin-top: 10px;
            border-radius: 4px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- КНОПКА ВОЗВРАТА НА ГЛАВНУЮ -->
   <div style="text-align: left; margin-bottom: 15px;">
    <a href="https://vbvsro-vlad.github.io/aprende-espanol-site/principiante.html" style="color: #3498db; text-decoration: none; font-weight: bold; font-size: 0.9rem; transition: color 0.2s;" onmouseover="this.style.color='#2980b9'" onmouseout="this.style.color='#3498db'">⬅ Вернуться на главную</a>
    </div>

    <h2>Уровень 1: Сленговый Старт 👶</h2>
    
    <div class="hacker-card">
        <div class="hacker-title">🎧 Инструкция:</div>
        <div id="pre-hint-text">Нажмите «ВКЛЮЧИТЬ ТРЕНАЖЁР» для старта.</div>
    </div>

    <button class="control-btn" id="audio-trigger-btn" onclick="playCurrentSegment()" disabled>🔊 Послушать реплику</button>

    <div class="dictation-zone">
        <div class="step-info" id="step-label">Реплика -- из --</div>
        <div id="role-tag-container"></div>
        <div style="font-size: 0.9rem; color: #84817a; margin-bottom: 5px;">Ваш результат разбора:</div>
        <div id="user-visual-feedback" style="font-size: 1.2rem; font-weight: bold; color: #f5f6fa; min-height: 30px; line-height: 1.6;">...</div>
    </div>

    <audio id="player" src="../assets/audio/intro.mp3" style="display: none;"></audio>

    <input type="text" id="user-input" placeholder="Вводите то, что услышали..." autocomplete="off" disabled>
    
    <button class="action-btn" id="main-btn" onclick="initTrainer()">ВКЛЮЧИТЬ ТРЕНАЖЁР</button>
    <button class="control-btn" id="giveup-btn" style="background-color: #ee5253; margin-top: 10px; display: none;" onclick="showCorrectAnswer()">🏳️ Разобрать всю фразу целиком</button>
    
    <div class="feedback" id="feedback-zone"></div>
</div>

<script>
    // БАЗА ДАННЫХ ДИКТАНТА: ТАЙМИНГИ И ИНДИВИДУАЛЬНЫЕ ОБЪЯСНЕНИЯ ДЛЯ КАЖДОГО СЛОВА
    const database = new Array(
        {
            speaker: "Пабло",
            roleClass: "role-pablo",
            start: 0,
            end: 1.37,
            es: "Hola Que pasa",
            ru: "Привет! Как жизнь? / Что происходит?",
            wordExpl: {
                "hola": "<b>Ловушка немой H:</b> Буква <b>H</b> в испанском языке не читается вообще! Вы слышите [Ола], но писать нужно строго с H.",
                "que": "<b>Сочетание QU:</b> Звук [К] перед гласными e/i передается через буквы <b>qu</b>. Буква u при этом не читается.",
                "pasa": "<b>Звук С:</b> В сленговой фразе <i>¿Qué pasa?</i> (Что происходит?) слышится обычный звук [С], поэтому пишется простая буква <b>s</b>."
            }
        },
        {
            speaker: "Люсия",
            roleClass: "role-lucia",
            start: 1.37,
            end: 2.52,
            es: "Vamos tarde",
            ru: "Мы опаздываем!",
            wordExpl: {
                "vamos": "<b>Ловушка V / B:</b> Буквы V и B в испанском звучат одинаково (как русская Б)! Вы слышите [Бамос], но пишется это слово через <b>V</b>.",
                "tarde": "<b>Конструкция ir tarde:</b> Дословно означает 'идти поздно'. В испанском нет глагола 'опаздывать', они используют этот шаблон."
            }
        },
        {
            speaker: "Пабло",
            roleClass: "role-pablo",
            start: 2.52,
            end: 5.1,
            es: "En serio Que hora es",
            ru: "Серьёзно? Который час?",
            wordExpl: {
                "en": "<b>Предлог:</b> Обычный короткий предлог направления или состояния.",
                "serio": "<b>Звук С:</b> В выражении <i>¿En serio?</i> (Серьёзно?) пишется обычная буква <b>s</b>.",
                "que": "<b>Вопросительное слово:</b> Пишется через <b>qu</b> (буква u немая).",
                "hora": "<b>Ловушка немой H:</b> В слове <i>hora</i> (час) первая буква <b>H</b> не произносится, но на письме обязательна!",
                "es": "<b>Глагол:</b> Форма глагола <i>ser</i> (быть/являться) для третьего лица."
            }
        },
        {
            speaker: "Люсия",
            roleClass: "role-lucia",
            start: 5.1,
            end: 7.24,
            es: "Son las ocho Salgo corriendo",
            ru: "Уже восемь. Я убегаю со всех ног!",
            wordExpl: {
                "son": "<b>Время:</b> Глагол 'быть' во множественном числе, используется для обозначения любого времени, кроме 1 часа.",
                "las": "<b>Артикул:</b> Определенный артикул женского рода множественного числа.",
                "ocho": "<b>Числительное:</b> Буквосочетание <b>ch</b> даёт мягкий русский звук [Ч]. Слово пишется как <i>ocho</i> (восемь).",
                "salgo": "<b>Глагол:</b> Форма от глагола <i>salir</i> (выходить). Я выхожу.",
                "corriendo": "<b>Герундий:</b> Означает бегом. Выражение <i>Salgo corriendo</i> используется, когда человек сильно торопится."
            }
        },
        {
            speaker: "Пабло",
            roleClass: "role-pablo",
            start: 7.24,
            end: 9.54,
            es: "Madre mia Hasta luego",
            ru: "Мама дорогая! До встречи!",
            wordExpl: {
                "madre": "<b>Существительное:</b> Мать.",
                "mia": "<b>Местоимение:</b> Моя. Восклицание <i>¡Madre mía!</i> выражает сильное удивление, шок или восторг.",
                "hasta": "<b>Ловушка немой H:</b> В предлоге <i>hasta</i> (до) буква <b>H</b> абсолютно немая, её не слышно в аудиопотоке.",
                "luego": "<b>Наречие:</b> Потом. Фраза <i>Hasta luego</i> дословно переводится как 'До потом' и является стандартным прощанием."
            }
        }
    );
    let currentStep = 0;
    let isCheckingStage = false;
    let checkInterval = null;

    const player = document.getElementById('player');
    const userInput = document.getElementById('user-input');
    const mainBtn = document.getElementById('main-btn');
    const giveUpBtn = document.getElementById('giveup-btn');
    const feedbackZone = document.getElementById('feedback-zone');
    const preHintText = document.getElementById('pre-hint-text');
    const stepLabel = document.getElementById('step-label');
    const roleContainer = document.getElementById('role-tag-container');
    const userVisualFeedback = document.getElementById('user-visual-feedback');
    const audioTriggerBtn = document.getElementById('audio-trigger-btn');

    // Настраиваем корректный относительный путь к вашей папке assets на гитхабе и локально
    player.src = "../assets/audio/intro.mp3";

    function cleanString(str) {
        return str.toLowerCase()
            .replace(/[.,\/#!$%\^&\*;:{}=\-_`~()¿?]/g, "")
            .replace(/[áäà]/g, "a").replace(/[éëè]/g, "e")
            .replace(/[íïì]/g, "i").replace(/[óöò]/g, "o")
            .replace(/[úüù]/g, "u").replace(/ñ/g, "n")
            .replace(/\s+/g, " ")
            .trim();
    }

    function initTrainer() {
        currentStep = 0;
        userInput.disabled = false;
        audioTriggerBtn.disabled = false;
        triggerStep();
    }

    function triggerStep() {
        clearInterval(checkInterval);
        if (currentStep >= database.length) {
            stepLabel.innerText = "ФИНИШ";
            roleContainer.innerHTML = "";
            preHintText.innerHTML = "🏆 Разминка завершена! Вы отлично справились со всеми ловушками чтения!";
            userVisualFeedback.innerText = "¡Todo funciona, amigo!";
            userInput.disabled = true;
            userInput.value = "";
            feedbackZone.innerText = "";
            giveUpBtn.style.display = "none";
            audioTriggerBtn.disabled = true;
            
            mainBtn.innerText = "Пройти уровень заново 🔄";
            mainBtn.onclick = initTrainer;
            isCheckingStage = false;
            return;
        }

        stepLabel.innerText = 'Реплика ' + (currentStep + 1) + ' из ' + database.length;
        
        // Вовлекающий призыв к действию вместо готовой подсказки ДО звука
        preHintText.innerHTML = "🎧 <b>Доверься своему слуху!</b> Послушай фразу Пабло или Люсии и запиши её так, как, по твоему мнению, она должна писаться на испанском. Не бойся ловушек — система мягко разберёт каждую опечатку после проверки.";
        
        const currentData = database[currentStep];
        roleContainer.innerHTML = '<span class="role-tag ' + currentData.roleClass + '">🗣️ Говорит: ' + currentData.speaker + '</span>';
        userVisualFeedback.innerHTML = "<span style='color:#84817a;'>Ждём ваш ввод...</span>";
        
        feedbackZone.innerText = "";
        userInput.value = "";
        userInput.focus();
        giveUpBtn.style.display = "block";

        mainBtn.innerText = "Проверить фразу";
        mainBtn.onclick = evaluateText;
        isCheckingStage = true;

        playCurrentSegment();
    }

    function playCurrentSegment() {
        clearInterval(checkInterval);
        if (currentStep >= database.length) return;
        
        const segment = database[currentStep];
        player.currentTime = segment.start;
        player.play();

        checkInterval = setInterval(function() {
            if (player.currentTime >= segment.end) {
                player.pause();
                clearInterval(checkInterval);
            }
        }, 10);
    }

    function evaluateText() {
        clearInterval(checkInterval);
        player.pause();

        const userInputValue = userInput.value.trim();
        if (!userInputValue) {
            feedbackZone.innerHTML = "<span style='color: #ee5253; font-weight: bold;'>⚠️ Сначала введите то, что услышали!</span>";
            return;
        }

        const rawUserWords = userInputValue.split(/\s+/);
        const correctClean = cleanString(database[currentStep].es);
        const correctWords = correctClean.split(" ");
        const originalWordsWithCase = database[currentStep].es.split(" ");
        
        let visualResult = new Array();
        let errorExplanations = new Array();
        let hasErrors = false;

        // ИНТЕЛЛЕКТУАЛЬНЫЙ ПОСЛОВНЫЙ АНАЛИЗ
        for (let i = 0; i < correctWords.length; i++) {
            const userWordRaw = rawUserWords[i];
            const targetWordClean = correctWords[i];
            const targetWordOriginal = originalWordsWithCase[i];
            
            if (!userWordRaw) {
                // Если пользователь пропустил слово в конце фразы
                visualResult.push("<span class='missing-word'>[" + targetWordOriginal + "]</span>");
                hasErrors = true;
                
                if (database[currentStep].wordExpl[targetWordClean]) {
                    errorExplanations.push("<div class='explanation-card'>" + database[currentStep].wordExpl[targetWordClean] + "</div>");
                }
            } else {
                const userWordClean = cleanString(userWordRaw);
                if (userWordClean === targetWordClean) {
                    // Идельно совпало
                    visualResult.push(rawUserWords[i]);
                } else {
                    // Ошибка: слово пользователя красным + оригинал в скобках зеленым
                    visualResult.push("<span class='error-word'>" + rawUserWords[i] + "</span><span class='correct-fix'>(" + targetWordOriginal + ")</span>");
                    hasErrors = true;
                    
                    // Собираем точечное объяснение именно для этой опечатки
                    if (database[currentStep].wordExpl[targetWordClean]) {
                        errorExplanations.push("<div class='explanation-card'>" + database[currentStep].wordExpl[targetWordClean] + "</div>");
                    }
                }
            }
        }

        userVisualFeedback.innerHTML = visualResult.join(" ");

        if (!hasErrors && rawUserWords.length === correctWords.length) {
            feedbackZone.innerHTML = "<span style='color: #10ac84; font-weight: bold;'>🎯 Великолепно! Ни одной ошибки. Идём дальше!</span>";
            currentStep++;
            mainBtn.innerText = "Следующая фраза ▶";
            mainBtn.onclick = triggerStep;
            giveUpBtn.style.display = "none";
            isCheckingStage = false;
        } else {
            // Формируем блок разбора ошибок снизу
            let explanationHTML = '<span style="color: #ee5253; font-weight: bold;">⚠️ Кое-где слух подвёл. Разбор ваших ловушек:</span>';
            
            if (errorExplanations.length > 0) {
                // Выводим только те правила, в которых человек реально ошибся!
                explanationHTML += errorExplanations.join("");
            } else {
                explanationHTML += "<div class='explanation-card'><b>Подсказка перевода:</b> \"" + database[currentStep].ru + "\". Возможно, вы написали лишние слова в конце фразы. Переслушайте ещё раз!</div>";
            }
            
            feedbackZone.innerHTML = explanationHTML;
        }
    }

    function showCorrectAnswer() {
        clearInterval(checkInterval);
        player.pause();
        
        userVisualFeedback.innerHTML = database[currentStep].es;
        feedbackZone.innerHTML = '<span style="color: #ff9f43; font-weight: bold;">Оригинал фразы показан. Перевод: "' + database[currentStep].ru + '"</span>';
        
        currentStep++;
        mainBtn.innerText = "Продолжить уровень";
        mainBtn.onclick = triggerStep;
        giveUpBtn.style.display = "none";
        isCheckingStage = false;
    }

    userInput.addEventListener("keyup", function(e) {
        if (e.key === "Enter") {
            if (isCheckingStage) evaluateText();
            else triggerStep();
        }
    });
</script>
</body>
</html>
