<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Матрица Времён PRO 🧠 — Aprende Español</title>
    <style>
        *{box-sizing:border-box}
body{font-family:Arial,Helvetica,sans-serif;background:#f7f8fa;margin:0;min-height:100vh;color:#243044;display:flex;justify-content:center;align-items:flex-start;padding:50px 20px}
.container{background:#fff;width:100%;max-width:760px;padding:42px;border-radius:24px;box-shadow:0 12px 35px rgba(31,41,55,.10);border:1px solid #e8ebf0;text-align:center}
h2{color:#243044;margin:0 0 18px;font-size:1.8rem;line-height:1.25}.badge,.verb-tag{display:inline-block;background:#f2b705;color:#fff;padding:5px 11px;border-radius:999px;font-size:.72rem;font-weight:700;text-transform:uppercase}.score-zone{color:#687386;font-size:1rem;margin:0 0 24px;display:flex;justify-content:space-between;background:#f7f8fa;padding:10px 15px;border-radius:10px;border:1px solid #e8ebf0}.scenario-box{background:#fff8e6;padding:22px;border-radius:14px;margin-bottom:18px;border-left:5px solid #f2b705;text-align:left}.scenario-title{font-size:.8rem;text-transform:uppercase;color:#b27d00;font-weight:700;margin-bottom:7px}.scenario-text{font-size:1.08rem;color:#243044;line-height:1.55;font-weight:500}.phrase-display{font-size:1.2rem;background:#f7f8fa;padding:17px;border-radius:12px;margin-bottom:22px;border:1px solid #e1e5eb;font-weight:700;color:#243044}.options-grid{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:20px}.option-btn{background:#fff;color:#243044;border:2px solid #e1e5eb;padding:15px;border-radius:12px;cursor:pointer;font-weight:700;font-size:1.05rem;text-align:left;transition:.2s}.option-btn:hover{border-color:#d62828;background:#fff8f8}.option-btn.correct{background:#eaf7f0;border-color:#16834b;color:#16834b}.option-btn.wrong{background:#fff0f0;border-color:#d62828;color:#d62828}.explanation-box{background:#f7f8fa;border-radius:12px;padding:18px;margin:18px 0;text-align:left;line-height:1.55;border:1px solid #e8ebf0}.next-btn{background:#d62828;color:#fff;border:none;padding:16px 20px;font-size:1.05rem;border-radius:12px;cursor:pointer;width:100%;font-weight:700}.next-btn:hover{background:#b71f1f}.back-home{display:inline-block;margin-top:24px;color:#687386;text-decoration:none;font-size:.95rem}.back-home:hover{color:#d62828}@media(max-width:600px){body{padding:20px 14px}.container{padding:28px 20px;border-radius:18px}h2{font-size:1.45rem}.scenario-text{font-size:1rem}}
    </style>
</head>
<body>

<div class="container">
    <h2>Матрица Времён: Топ Глаголы 🧠</h2>
    
    <div class="score-zone">
        <div id="quest-num">Вопрос: --</div>
        <div id="score-count">Счет: 0</div>
    </div>

    <div class="scenario-box">
        <div class="scenario-title" id="verb-tag">Глагол: --</div>
        <div class="scenario-text" id="situation-text">Загрузка ситуации...</div>
    </div>

    <div class="phrase-display" id="phrase-text">
        ...
    </div>

    <div class="options-grid" id="options-box">
        <!-- Кнопки сгенерируются кодом -->
    </div>
    
    <div class="explanation-box" id="explanation-box"></div>
    <button class="next-btn" id="next-btn" onclick="nextQuestion()">Следующая ситуация ▶</button>
<a href="../index.html" class="back-home">← Вернуться на главную</a>

</div>

<script>
    // БАЗА ДАННЫХ ИГРЫ: СИТУАЦИИ, ВАРИАНТЫ И УМНЫЕ ПОДСКАЗКИ ПРИ ОШИБКАХ
    const matrixDatabase = [
        {
            verb: "HACER",
            situation: "Вы сидите за компьютером, у вас горит дедлайн, пальцы летают по клавиатуре. В комнату заходит друг и спрашивает: «Что делаешь?». Вы отвечаете: «Я делаю работу прямо сейчас, не мешай!»",
            phrase: "Ahora [___] el trabajo, ¡no me molestes!",
            correct: "estoy haciendo",
            options: ["hago", "estoy haciendo", "he hecho", "estaba haciendo"],
            expl: "<b>Почему именно так:</b> Действие происходит прямо в эту миллисекунду. Для этого испанцы используют Presente Continuo (estoy + -iendo).<br><br><b>Разбор ошибок:</b><br>❌ <i>hago</i> — означает регулярное действие вообще (по жизни), теряется срочность дедлайна.<br>❌ <i>he hecho</i> — 'я уже сделал', но вы ещё в процессе.<br>❌ <i>estaba haciendo</i> — относилось бы к процессу в прошлом."
        },
        {
            verb: "TRABAJAR",
            situation: "Вы звоните другу в 3 часа дня. Он берёт трубку и говорит уставшим голосом: «Извини, не могу говорить. Я только что закончил, я сегодня очень много поработал». (Результат за сегодня)",
            phrase: "Lo siento, no puedo hablar. Hoy [___] mucho.",
            correct: "he trabajado",
            options: ["trabajo", "estaba trabajando", "he trabajado", "iba a trabajar"],
            expl: "<b>Почему именно так:</b> Действие завершено, но произошло <u>сегодня</u> (период времени 'hoy' ещё не закончен). Для этого строго нужен Pretérito Perfecto.<br><br><b>Разбор ошибок:</b><br>❌ <i>trabajo</i> — 'сегодня я много работаю' (вообще, процесс идёт или предстоит).<br>❌ <i>estaba trabajando</i> — 'я работал тогда' (когда что-то случилось в прошлом).<br>❌ <i>iba a trabajar</i> — 'я только собирался поработать', но друг-то уже отпахал!"
        },
        {
            verb: "IR",
            situation: "Вы вчера шли в магазин, и прямо перед вами на дорогу выбежала огромная собака. Вы рассказываете историю другу: «Я как раз шёл в магазин (был в процессе движения), когда увидел эту собаку!»",
            phrase: "Yo [___] al supermercado cuando vi a ese perro.",
            correct: "iba",
            options: ["voy", "he ido", "estaba yendo", "iba"],
            expl: "<b>Почему именно так:</b> Для выражения процесса ходьбы или движения в прошлом используется форма 'iba' (глагол ir в Imperfecto).<br><br><b>Разбор ошибок:</b><br>❌ <i>voy</i> — 'я иду' (сейчас или обычно).<br>❌ <i>he ido</i> — 'я ходил/сходил сегодня' (как факт, а не фоновый процесс).<br>❌ <i>estaba yendo</i> — теоретически понятно, но испанцы так не говорят, форма слишком громоздкая для глагола ir. Всегда выбирайте 'iba'!"
        },
        {
            verb: "HACER",
            situation: "Вы открыли ноутбук, занесли палец над кнопкой, чтобы запустить тренажёр, но в эту миллисекунду вырубило свет. Вы со вздохом говорите: «Эх, я как раз собирался заняться диктантом...»",
            phrase: "Yo [___] el dictado, pero se cortó la luz.",
            correct: "iba a hacer",
            options: ["hago", "iba a hacer", "he hecho", "estaba haciendo"],
            expl: "<b>Почему именно так:</b> Конструкция 'iba a + глагол' идеально передаёт намерение, которое вот-вот должно было случиться в прошлом, но обломалось.<br><br><b>Разбор ошибок:</b><br>❌ <i>hago</i> — 'я делаю' (сейчас).<br>❌ <i>he hecho</i> — 'я сделал' (но свет-то прервал вас до начала!).<br>❌ <i>estaba haciendo</i> — означало бы, что вы уже вовсю писали диктант в тот момент."
        },
        {
            verb: "COMER",
            situation: "Вы пообедали в ресторане, откинулись на спинку стула, похлопали по животу и сыто говорите официанту: «Спасибо, я уже отлично поел». (Результат)",
            phrase: "Gracias, ya [___] muy bien.",
            correct: "he comido",
            options: ["como", "estoy comiendo", "he comido", "estaba comiendo"],
            expl: "<b>Почему именно так:</b> Вы сыты в текущую секунду, действие завершено совсем недавно. Это классический результат через Pretérito Perfecto.<br><br><b>Разбор ошибок:</b><br>❌ <i>como</i> — 'я ем вообще' или 'я ем обычно'.<br>❌ <i>estoy comiendo</i> — 'я ем прямо сейчас' (но ваша тарелка уже пуста!).<br>❌ <i>estaba comiendo</i> — 'я ел тогда в прошлом'."
        },
        {
            verb: "TRABAJAR",
            situation: "Вам звонит босс на выходных и спрашивает: «Чем занимаешься по жизни в эти месяцы?». Вы гордо отвечаете: «Сейчас я работаю в крупной IT-компании». (Регулярное действие по жизни)",
            phrase: "Ahora [___] en una empresa de tecnología grande.",
            correct: "trabajo",
            options: ["trabajo", "estoy trabajando", "he trabajado", "estaba trabajando"],
            expl: "<b>Почему именно так:</b> Вы описываете постоянный или регулярный факт из жизни в настоящем времени. Нужен обычный Presentе.<br><br><b>Разбор ошибок:</b><br>❌ <i>estoy trabajando</i> — подошёл бы, если бы вы сидели за компьютером прямо в эту секунду разговора.<br>❌ <i>he trabajado</i> — 'я поработал'.<br>❌ <i>estaba trabajando</i> — прошедшее время."
        },
        {
            verb: "HACER",
            situation: "Вчера в 16:00 в офисе кто-то съел чужой пирог. Шеф устраивает допрос: «Что вы делали в это время?». Вы оправдываетесь: «Я в эту секунду делал отчёт в своём кабинете!» (Алиби, процесс в прошлом)",
            phrase: "A las cuatro yo [___] el informe en mi oficina.",
            correct: "estaba haciendo",
            options: ["hago", "estoy haciendo", "he hecho", "estaba haciendo"],
            expl: "<b>Почему именно так:</b> Вы доказываете своё алиби — были внутри длительного процесса в строго конкретный момент в прошлом. Для этого нужен Pasado Continuo (estaba + -iendo).<br><br><b>Разбор ошибок:</b><br>❌ <i>hago / estoy haciendo</i> — формы настоящего времени.<br>❌ <i>he hecho</i> — 'я сделал отчёт' (как факт завершения, а нам важно показать, чем вы были заняты в 16:00)."
        },
        {
            verb: "IR",
            situation: "Вы встречаете соседа у подъезда, он одет в спортивный костюм. Вы спрашиваете его: «Куда это ты направляешься прямо сейчас?»",
            phrase: "¿Adónde [___] ahora?",
            correct: "vas",
            options: ["vas", "estás yendo", "has ido", "ibas"],
            expl: "<b>Почему именно так:</b> В живом испанском глагол ir (идти) в настоящем времени используется в обычной форме Presente ('vas'), даже если человек идёт прямо сейчас. Форма estás yendo почти не используется.<br><br><b>Разбор ошибок:</b><br>❌ <i>estás yendo</i> — слишком искусственно и громоздко для живой речи.<br>❌ <i>has ido</i> — 'ты сходил'.<br>❌ <i>ibas</i> — прошедшее время."
        },
        {
            verb: "COMER",
            situation: "Вы сидите на совещании, и вдруг у вас громко заурчал живот (как в подкасте Пабло). Вы шепчете коллеге: «Извини, я сегодня ещё не ел». (Отсутствие результата за сегодня)",
            phrase: "Lo siento, hoy todavía no [___].",
            correct: "he comido",
            options: ["como", "estoy comiendo", "he comido", "iba a comer"],
            expl: "<b>Почему именно так:</b> Вы говорите об отсутствии результата к текущему моменту внутри сегодняшнего дня ('hoy'). Нужен Pretérito Perfecto.<br><br><b>Разбор ошибок:</b><br>❌ <i>como</i> — 'я не ем вообще'.<br>❌ <i>estoy comiendo</i> — 'я не ем прямо сейчас' (и так очевидно).<br>❌ <i>iba a comer</i> — 'я собирался поесть'."
        },
        {
            verb: "TRABAJAR",
            situation: "Вчера в 7 вечера жена пыталась до вас дозвониться, но вы пахали в гараже. Вечером вы объясняете: «Извини, я в это время работал». (Длительный процесс в прошлом)",
            phrase: "Lo siento, a esa hora yo [___] en el garaje.",
            correct: "estaba trabajando",
            options: ["trabajo", "estoy trabajando", "he trabajado", "estaba trabajando"],
            expl: "<b>Почему именно так:</b> Вы были заняты процессом работы в конкретный момент в прошлом. Это Pasado Continuo.<br><br><b>Разбор ошибок:</b><br>❌ <i>trabajo / estoy trabajando</i> — настоящее время.<br>❌ <i>he trabajado</i> — подошло бы, если бы вы сказали 'Я сегодня много поработал', но здесь указан точный час вчерашнего дня."
        },
        {
            verb: "HACER",
            situation: "Вы хвастаетесь перед учителем испанского идеально выполненным домашним заданием: «Посмотрите, я уже сделал все упражнения!» (Результат, гордость)",
            phrase: "¡Mire, ya [___] todos los ejercicios!",
            correct: "he hecho",
            options: ["hago", "estoy haciendo", "he hecho", "iba a hacer"],
            expl: "<b>Почему именно так:</b> Налицо выполненное действие и готовый результат, который вы демонстрируете в настоящем времени. Это Pretérito Perfecto.<br><br><b>Разбор ошибок:</b><br>❌ <i>hago / estoy haciendo</i> — вы уже не делаете упражнения, они готовы.<br>❌ <i>iba a hacer</i> — 'я только собирался сделать'."
        },
        {
            verb: "COMER",
            situation: "Вам звонит друг, слышит в трубке стук вилок и чавканье. Он понимающе говорит: «О, я вижу, ты сейчас ешь. Приятного аппетита, созвонимся позже!»",
            phrase: "Ah, veo que [___] ahora. ¡Buen provecho!",
            correct: "estás comiendo",
            options: ["comes", "estás comiendo", "has comido", "ibas a comer"],
            expl: "<b>Почему именно так:</b> Процесс происходит прямо в ушах у друга в эту секунду. Строго Presente Continuo (estás + -iendo).<br><br><b>Разбор ошибок:</b><br>❌ <i>comes</i> — 'ты ешь вообще'.<br>❌ <i>has comido</i> — 'ты уже поел' (но вилки-то стучат!).<br>❌ <i>ibas a comer</i> — 'ты собирался поесть'."
        },
        {
            verb: "IR",
            situation: "Вам звонит мама и спрашивает, где вы были в прошлые выходные. Вы отвечаете: «В субботу мы ездили (сходили) за город». (Завершённый факт в прошлом, день полностью прошёл)",
            phrase: "El sábado nosotros [___] al campo.",
            correct: "fuimos",
            options: ["vamos", "hemos ido", "fuimos", "íbamos"],
            expl: "<b>Почему именно так:</b> Суббота осталась в прошлом, день полностью отрезан от настоящего. Для законченных исторических фактов используется время Pretérito Indefinito (ir ➡️ fuimos).<br><br><b>Разбор ошибок:</b><br>❌ <i>vamos</i> — 'мы идём/ездим обычно'.<br>❌ <i>hemos ido</i> — подошло бы, если бы вы поехали в поле <u>сегодня</u>.<br>❌ <i>íbamos</i> — означало бы 'мы долго ехали, были в процессе', а здесь важен сам свершившийся факт поездки."
        },
        {
            verb: "TRABAJAR",
            situation: "Вы зашли в кабинет к коллеге, он резко захлопнул ноутбук и выдохнул. Вы с улыбкой говорите: «О, я вижу, ты как раз собирался поработать, а я помешал?»",
            phrase: "Veo que [___], ¿te he molestado?",
            correct: "ibas a trabajar",
            options: ["trabajas", "estás trabajando", "has trabajado", "ibas a trabajar"],
            expl: "<b>Почему именно так:</b> Человек открыл ноут и настроился на работу в прошлую секунду, но его прервали. Это намерение через 'ibas a + глагол'.<br><br><b>Разбор ошибок:</b><br>❌ <i>trabajas / estás trabajando</i> — он уже не работает, вы его отвлекли.<br>❌ <i>has trabajado</i> — 'ты поработал'."
        },
        {
            verb: "COMER",
            situation: "Вы рассказываете о своих привычках: «Обычно я обедаю дома в два часа дня». (Регулярное расписание)",
            phrase: "Normalmente [___] en casa a las dos.",
            correct: "como",
            options: ["como", "estoy comiendo", "he comido", "estaba comiendo"],
            expl: "<b>Почему именно так:</b> Регулярное, повторяющееся действие, рутина. Нужен обычный Presente.<br><br><b>Разбор ошибок:</b><br>❌ <i>estoy comiendo</i> — использовалось бы, если бы вы жевали прямо сейчас.<br>❌ <i>he comido / estaba comiendo</i> — прошедшие времена."
        },
        {
            verb: "IR",
            situation: "Вы сидите в аэропорту, рейс задерживают. Вы звоните жене и говорите: «Мы как раз садились (шли) в самолёт, но посадку внезапно остановили!» (Процесс прерван в прошлом)",
            phrase: "Nosotros [___] al avión, pero detuvieron el embarque.",
            correct: "íbamos",
            options: ["vamos", "hemos ido", "fuimos", "íbamos"],
            expl: "<b>Почему именно так:</b> Вы описываете фоновый процесс движения, который происходил в прошлом, пока его не прервало другое резкое действие. Нужен Imperfecto глагола ir (для 'мы' — íbamos).<br><br><b>Разбор ошибок:</b><br>❌ <i>vamos</i> — настоящее время.<br>❌ <i>fuimos</i> — означало бы, что вы успешно улетели и факт закрыт.<br>❌ <i>hemos ido</i> — форма для сегодняшнего дня."
        }
    ];
    let gameQuestions = [];
    let currentQuestionIdx = 0;
    let score = 0;
    let hasAnswered = false;

    // СТАРТ ИГРЫ И ПЕРЕМЕШИВАНИЕ ВОПРОСОВ
    window.onload = function() {
        shuffleAndStart();
    };

    function shuffleAndStart() {
        gameQuestions = [...matrixDatabase].sort(() => Math.random() - 0.5);
        currentQuestionIdx = 0;
        score = 0;
        document.getElementById('score-count').innerText = `Счет: ${score}`;
        showQuestion();
    }

    function showQuestion() {
        hasAnswered = false;
        document.getElementById('next-btn').style.display = "none";
        document.getElementById('explanation-box').style.display = "none";
        
        const q = gameQuestions[currentQuestionIdx];
        
        document.getElementById('quest-num').innerText = `Ситуация: ${currentQuestionIdx + 1} из ${gameQuestions.length}`;
        document.getElementById('verb-tag').innerText = `Глагол: ${q.verb}`;
        document.getElementById('situation-text').innerText = q.situation;
        document.getElementById('phrase-text').innerText = q.phrase;

        const optionsBox = document.getElementById('options-box');
        optionsBox.innerHTML = "";

        // Генерируем кнопки
        q.options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = "option-btn";
            btn.innerText = opt;
            btn.onclick = () => checkSelection(btn, opt, q.correct, q.expl);
            optionsBox.appendChild(btn);
        });
    }

    function checkSelection(clickedBtn, selectedOpt, correctOpt, explanation) {
        if (hasAnswered) return; // Защита от повторных нажатий на другие кнопки после успеха

        if (selectedOpt === correctOpt) {
            clickedBtn.classList.add('correct');
            score += 25; // Начисляем 25 очков за правильный выбор
            document.getElementById('score-count').innerText = `Счет: ${score}`;
            hasAnswered = true;
            document.getElementById('next-btn').style.display = "block";
            
            // Озвучиваем правильный ответ встроенным голосом
            if ('speechSynthesis' in window) {
                const textToSpeak = gameQuestions[currentQuestionIdx].phrase.replace("[___]", correctOpt).replace("¡", "").replace("!", "");
                const utterance = new SpeechSynthesisUtterance(textToSpeak);
                utterance.lang = 'es-ES';
                window.speechSynthesis.speak(utterance);
            }
        } else {
            clickedBtn.classList.add('incorrect');
            // Показываем разбор ситуации при ошибке
            const expBox = document.getElementById('explanation-box');
            expBox.innerHTML = explanation;
            expBox.style.display = "block";
        }
    }

    function nextQuestion() {
        currentQuestionIdx++;
        if (currentQuestionIdx < gameQuestions.length) {
            showQuestion();
        } else {
            // Финиш игры
            document.getElementById('verb-tag').innerText = "ИГРА ЗАВЕРШЕНА! 🏆";
            document.getElementById('situation-text').innerText = `Потрясающе! Вы прогнали все 16 ситуаций. Ваш финальный результат: ${score} очков.`;
            document.getElementById('phrase-text').innerText = "¡Todo marcha bien!";
            document.getElementById('options-box').innerHTML = "";
            document.getElementById('explanation-box').style.display = "none";
            
            const nextBtn = document.getElementById('next-btn');
            nextBtn.innerText = "Пройти тренажёр заново 🔄";
            nextBtn.onclick = shuffleAndStart;
            nextBtn.style.display = "block";
        }
    }
</script>

</body>
</html>
