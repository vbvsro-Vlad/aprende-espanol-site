<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aprende Español: Разминка Новичка 👶</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0f19;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: #fff;
            padding: 20px;
        }
        .container {
            background: #151d30;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(46, 204, 113, 0.15);
            width: 100%;
            max-width: 520px;
            text-align: center;
            border: 1px solid #2d3d5a;
        }
        h2 { color: #2ecc71; margin-top: 0; font-size: 1.4rem; text-transform: uppercase; letter-spacing: 1px; }
        
        .role-tag {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        .role-pablo { background: rgba(52, 152, 219, 0.2); color: #3498db; }
        .role-lucia { background: rgba(230, 126, 34, 0.2); color: #e67e22; }

        .dictation-zone {
            background: #1f2d4d;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 5px solid #2ecc71;
            text-align: left;
        }
        .step-info {
            font-size: 0.8rem;
            text-transform: uppercase;
            color: #2ecc71;
            font-weight: bold;
            margin-bottom: 5px;
            text-align: center;
        }
        .hint-text {
            font-size: 1.2rem;
            font-weight: 600;
            color: #f5f6fa;
            min-height: 35px;
            line-height: 1.4;
        }
        input[type="text"] {
            width: 100%;
            padding: 14px;
            border: 2px solid #3b5998;
            background-color: #0b0f19;
            color: white;
            border-radius: 8px;
            font-size: 1.1rem;
            box-sizing: border-box;
            margin-bottom: 15px;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus { border-color: #2ecc71; outline: none; }
        
        .grammar-box {
            background: #16222f;
            border: 1px solid #2ecc71;
            color: #f5f6fa;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            text-align: left;
            font-size: 0.9rem;
            line-height: 1.5;
            display: none;
        }
        .grammar-title {
            font-weight: bold;
            color: #2ecc71;
            margin-bottom: 5px;
            text-transform: uppercase;
            font-size: 0.8rem;
        }
        .action-btn {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 14px;
            font-size: 1.1rem;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            transition: background 0.2s;
        }
        .action-btn:hover { background-color: #27ae60; }
        .control-btn {
            background: #233554;
            color: #fff;
            border: none;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
            width: 100%;
            margin-bottom: 15px;
        }
        .feedback { margin-top: 10px; font-weight: bold; min-height: 20px; }
        .correct { color: #10ac84; }
        .incorrect { color: #ee5253; }
    </style>
</head>
<body>

<div class="container">
    <h2>Часть 0: Разминка Новичка 👶</h2>
    
    <button class="control-btn" id="audio-trigger-btn" onclick="playCurrentSegment()">🔁 Переслушать реплику</button>

    <div class="dictation-zone">
        <div class="step-info" id="step-label">Реплика -- из --</div>
        <div id="role-tag-container"></div>
        <div class="hint-text" id="prompt-display">Нажмите «ВКЛЮЧИТЬ ТРЕНАЖЁР»</div>
    </div>

    <!-- Цельный плеер для одного файла intro.mp3 -->
    <audio id="player" src="../assets/audio/intro.mp3" style="display: none;"></audio>

    <input type="text" id="user-input" placeholder="Слушайте и вводите испанский текст..." autocomplete="off" disabled>
    
    <button class="action-btn" id="main-btn" onclick="initTrainer()">ВКЛЮЧИТЬ ТРЕНАЖЁР</button>
    <button class="control-btn" id="giveup-btn" style="background-color: #ee5253; margin-top: 10px; display: none;" onclick="showCorrectAnswer()">🏳️ Подсказать ответ</button>
    
    <div class="feedback" id="feedback-zone"></div>
    <div class="grammar-box" id="grammar-box"></div>
</div>

<script>
    // БАЗА ДАННЫХ ДИКТАНТА: ВАШИ ИДЕАЛЬНЫЕ ТАЙМИНГИ И РАЗБОРЫ СЛЕНГА
    const database = new Array(
        {
            speaker: "Пабло",
            roleClass: "role-pablo",
            start: 0,
            end: 1.37,
            es: "Hola Que pasa",
            ru: "Привет! Как жизнь? / Что происходит?",
            grammar: "<div class='grammar-title'>🧩 Разбор базы:</div><b>¿Qué pasa?</b> — это супер-популярный испанский сленг. Вместо академического '¿Cómo estás?' носители в 90% случаев говорят именно это. Дословно переводится как 'Что происходит?'."
        },
        {
            speaker: "Люсия",
            roleClass: "role-lucia",
            start: 1.37,
            end: 2.52,
            es: "Vamos tarde",
            ru: "Мы опаздываем!",
            grammar: "<div class='grammar-title'>🧩 Разбор базы:</div><b>Vamos tarde</b> — дословно означает 'Мы идём поздно'. В испанском языке нет удобного глагола для 'опаздывать'. Носители всегда используют конструкцию <i>ir tarde</i> (идти поздно). Запомните этот шаблон!"
        },
        {
            speaker: "Пабло",
            roleClass: "role-pablo",
            start: 2.52,
            end: 4.47,
            es: "En serio Que hora es",
            ru: "Серьёзно? Который час?",
            grammar: "<div class='grammar-title'>🧩 Разбор базы:</div><b>¿En serio?</b> — 'Серьёзно?' или 'Да ладно?'. Главная разговорная фраза для удивления. А вопрос <b>¿Qué hora es?</b> — это единственный способ спросить 'Который час?' в Испании."
        },
        {
            speaker: "Люсия",
            roleClass: "role-lucia",
            start: 4.47,
            end: 6.97,
            es: "Son las ocho Salgo corriendo",
            ru: "Уже восемь. Я убегаю со всех ног!",
            grammar: "<div class='grammar-title'>🧩 Разбор базы:</div><b>Son las ocho</b> — 'Сейчас 8 часов'. Для любого времени, кроме 1 часа, используется форма <i>Son las...</i>. Фраза <b>¡Salgo corriendo!</b> дословно: 'Я выхожу бегом' — когда сильно спешат."
        },
        {
            speaker: "Пабло",
            roleClass: "role-pablo",
            start: 6.97,
            end: 9.50,
            es: "Madre mia Hasta luego",
            ru: "Мама дорогая! До встречи!",
            grammar: "<div class='grammar-title'>🧩 Разбор базы:</div><b>¡Madre mía!</b> — дословно 'Мать моя!'. Главное эмоциональное восклицание испанцев (шок, удивление, восторг). <b>Hasta luego</b> — стандартное 'До свидания' (дословно: 'До потом')."
        }
    );

    let currentStep = 0;
    let isCheckingStage = false;
    let checkInterval = null;

    const player = document.getElementById('player');
    const userInput = document.getElementById('user-input');
    const mainBtn = document.getElementById('main-btn');
    const giveUpBtn = document.getElementById('giveup-btn');
    const feedbackZone = document.getElementById('feedback-zone');
    const promptDisplay = document.getElementById('prompt-display');
    const stepLabel = document.getElementById('step-label');
    const roleContainer = document.getElementById('role-tag-container');
    const grammarBox = document.getElementById('grammar-box');

    function cleanString(str) {
        return str.toLowerCase()
            .replace(/[.,\/#!$%\^&\*;:{}=\-_`~()¿?]/g, "")
            .replace(/[áäà]/g, "a").replace(/[éëè]/g, "e")
            .replace(/[íïì]/g, "i").replace(/[óöò]/g, "o")
            .replace(/[úüù]/g, "u").replace(/ñ/g, "n")
            .replace(/\s+/g, " ")
            .trim();
    }

    function initTrainer() {
        currentStep = 0;
        userInput.disabled = false;
        triggerStep();
    }

    function triggerStep() {
        clearInterval(checkInterval);
        if (currentStep >= database.length) {
            stepLabel.innerText = "ФИНИШ РАЗМИНКИ";
            roleContainer.innerHTML = "";
            promptDisplay.innerText = "🏆 ПОТРЯСАЮЩЕ! Первая разминка новичка пройдена успешно!";
            userInput.disabled = true;
            userInput.value = "";
            feedbackZone.innerText = "";
            grammarBox.style.display = "none";
            giveUpBtn.style.display = "none";
            
            mainBtn.innerText = "Пройти разминку заново";
            mainBtn.onclick = initTrainer;
            isCheckingStage = false;
            return;
        }

        stepLabel.innerText = 'Реплика ' + (currentStep + 1) + ' из ' + database.length;
        
        const currentData = database[currentStep];
        roleContainer.innerHTML = '<span class="role-tag ' + currentData.roleClass + '">🗣️ Говорит: ' + currentData.speaker + '</span>';
        promptDisplay.innerText = "Слушайте живой звук и вводите текст буквы в букву...";
        
        feedbackZone.innerText = "";
        userInput.value = "";
        userInput.focus();
        grammarBox.style.display = "none";
        giveUpBtn.style.display = "block";

        mainBtn.innerText = "Проверить фразу";
        mainBtn.onclick = evaluateText;
        isCheckingStage = true;

        playCurrentSegment();
    }

    function playCurrentSegment() {
        clearInterval(checkInterval);
        if (currentStep >= database.length) return;
        
        const segment = database[currentStep];
        player.currentTime = segment.start;
        player.play();

        checkInterval = setInterval(function() {
            if (player.currentTime >= segment.end) {
                player.pause();
                clearInterval(checkInterval);
            }
        }, 50);
    }

    function evaluateText() {
        clearInterval(checkInterval);
        player.pause();

        const userClean = cleanString(userInput.value);
        const correctClean = cleanString(database[currentStep].es);

        if (userClean === correctClean) {
            feedbackZone.innerHTML = "<span class='correct'>🎯 Идеально расслышано! Посмотрите разбор ниже:</span>";
            
            grammarBox.innerHTML = database[currentStep].grammar;
            grammarBox.style.display = "block";
            
            currentStep++;
            mainBtn.innerText = "Следующая реплика";
            mainBtn.onclick = triggerStep;
            giveUpBtn.style.display = "none";
            isCheckingStage = false;
        } else {
            feedbackZone.innerHTML = '<span class="incorrect">Не совпало. Подсказка-перевод: <b>"' + database[currentStep].ru + '"</b>. Переслушайте фразу!</span>';
        }
    }

    function showCorrectAnswer() {
        clearInterval(checkInterval);
        player.pause();
        
        feedbackZone.innerHTML = "<span style='color: #ff9f43;'>Показан правильный ответ. Изучите разбор:</span>";
        userInput.value = database[currentStep].es;
        
        grammarBox.innerHTML = database[currentStep].grammar;
        grammarBox.style.display = "block";
        
        currentStep++;
        mainBtn.innerText = "Продолжить разминку";
        mainBtn.onclick = triggerStep;
        giveUpBtn.style.display = "none";
        isCheckingStage = false;
    }

    userInput.addEventListener("keyup", function(e) {
        if (e.key === "Enter") {
            if (isCheckingStage) evaluateText();
            else triggerStep();
        }
    });
</script>
</body>
</html>
